<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NYC 최저가 비교</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif; margin: 0; background: #f0f2f5; }
        .container { max-width: 860px; margin: 30px auto; background: white; padding: 32px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.10); }

        h1 { text-align: center; color: #1a73e8; margin-bottom: 24px; font-size: 1.7em; }

        /* 카테고리 탭 */
        .tab-bar { display: flex; justify-content: center; gap: 12px; margin-bottom: 28px; }
        .tab-bar a {
            padding: 10px 28px; border: 2px solid #dee2e6; text-decoration: none;
            color: #555; border-radius: 24px; font-size: 1em; font-weight: 500;
            transition: all 0.18s;
        }
        .tab-bar a.active { background: #1a73e8; color: white; border-color: #1a73e8; }
        .tab-bar a:hover:not(.active) { background: #f0f4ff; border-color: #1a73e8; color: #1a73e8; }

        .section-title { font-size: 1.2em; color: #1a73e8; border-bottom: 2px solid #1a73e8; padding-bottom: 8px; margin-bottom: 18px; }

        /* 추천 박스 */
        .recommendation { background: #f0f7ff; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; }
        .recommendation h3 { margin: 0 0 8px; color: #1a73e8; font-size: 1em; }
        .rec-item { font-size: 0.9em; color: #444; margin: 3px 0; }

        /* 인원수 입력 */
        .personnel-input { display: flex; gap: 16px; margin-bottom: 18px; padding: 14px; border: 1px solid #dee2e6; border-radius: 8px; background: #fafafa; }
        .personnel-group { flex: 1; }
        .personnel-group label { display: block; font-weight: bold; margin-bottom: 5px; color: #333; font-size: 0.9em; }
        .personnel-group input { width: 100%; padding: 9px; border: 1px solid #ccc; border-radius: 6px; text-align: center; font-size: 1em; }

        /* 관광지 목록 */
        .item-list { list-style: none; padding: 0; margin: 0 0 18px; }
        .item-list li {
            padding: 11px 14px; margin-bottom: 7px; border: 1px solid #eee; border-radius: 8px;
            display: flex; align-items: center; gap: 12px; background: #fff;
            transition: border-color 0.15s;
        }
        .item-list li:hover { border-color: #1a73e8; }
        .item-info { flex-grow: 1; }
        .item-name { font-weight: bold; font-size: 1em; color: #222; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
        .item-detail { font-size: 0.85em; color: #777; margin-top: 2px; }
        .price-tag { font-weight: bold; color: #d32f2f; }

        /* 버튼 */
        .form-actions { display: flex; gap: 10px; margin-top: 4px; }
        .submit-btn { flex-grow: 3; padding: 13px; background: #28a745; color: white; border: none; border-radius: 8px; font-size: 1.05em; cursor: pointer; transition: background 0.18s; }
        .submit-btn:hover { background: #218838; }
        .reset-btn  { flex-grow: 1; padding: 13px; background: #6c757d; color: white; border: none; border-radius: 8px; font-size: 1.05em; cursor: pointer; transition: background 0.18s; }
        .reset-btn:hover  { background: #5a6268; }

        /* 뮤지컬 목록 */
        .musical-list { list-style: none; padding: 0; margin: 0; }
        .musical-list li {
            padding: 14px 16px; margin-bottom: 9px; border: 1px solid #eee; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center;
            background: #fff; transition: border-color 0.15s;
        }
        .musical-list li:hover { border-color: #1a73e8; }
        .musical-info { flex-grow: 1; }
        .musical-name { font-weight: bold; font-size: 1.05em; color: #222; }
        .musical-meta { font-size: 0.85em; color: #777; margin-top: 3px; }
        .compare-btn {
            padding: 9px 18px; background: #1a73e8; color: white;
            text-decoration: none; border-radius: 6px; font-size: 0.92em; font-weight: bold;
            transition: background 0.18s; white-space: nowrap;
        }
        .compare-btn:hover { background: #1558b0; }

        /* 모달 */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.55); }
        .modal-content {
            background: white; margin: 8% auto; padding: 28px; border-radius: 12px;
            width: 88%; max-width: 480px; box-shadow: 0 6px 24px rgba(0,0,0,0.2); position: relative;
        }
        .close-btn { position: absolute; top: 14px; right: 18px; font-size: 1.6em; cursor: pointer; color: #aaa; line-height: 1; }
        .close-btn:hover { color: #333; }
        .modal-title { font-size: 1.4em; color: #1a73e8; margin: 0 0 16px; }
        .modal-row { margin: 8px 0; font-size: 0.95em; line-height: 1.5; }
        .modal-label { font-weight: bold; color: #555; }
        .modal-link { display: inline-block; margin-top: 14px; padding: 10px 16px; background: #28a745; color: white; border-radius: 6px; text-decoration: none; font-size: 0.95em; }
    </style>
</head>
<body>
<div class="container">
    <h1>뉴욕 최저가 비교 시스템</h1>

    <div class="tab-bar">
        <a th:href="@{/(category='ticket')}"  th:class="${currentCategory == 'ticket'}  ? 'active' : ''">🎫 입장권 / 패스</a>
        <a th:href="@{/(category='musical')}" th:class="${currentCategory == 'musical'} ? 'active' : ''">🎭 뮤지컬</a>
    </div>

    <!-- ===== 입장권/패스 섹션 ===== -->
    <div th:if="${currentCategory == 'ticket'}">
        <div class="section-title">관광지 선택 후 패스 vs 개별 구매 비교</div>

        <div th:if="${recommendedItems != null and !recommendedItems.isEmpty()}" class="recommendation">
            <h3>⭐ 추천 관광지 TOP 3</h3>
            <div class="rec-item" th:each="item : ${recommendedItems}">
                · <strong th:text="${item.name}"></strong>
                  <span th:text="'(추천 점수: ' + ${item.recommendationScore} + '점)'"></span>
            </div>
        </div>

        <form th:action="@{/compare}" method="post" id="attractionForm">
            <div class="personnel-input">
                <div class="personnel-group">
                    <label for="adults">성인 인원 (13세 이상)</label>
                    <input type="number" id="adults" name="adults" value="2" min="1" required>
                </div>
                <div class="personnel-group">
                    <label for="children">아동 인원 (12세 이하)</label>
                    <input type="number" id="children" name="children" value="0" min="0" required>
                </div>
            </div>

            <ul class="item-list">
                <li th:each="item : ${items}">
                    <input type="checkbox" name="selectedAttractions" th:id="${item.id}" th:value="${item.id}">
                    <div class="item-info">
                        <label th:for="${item.id}" class="item-name"
                               th:onclick="|showDetailModal('${item.name}','${item.category}','${item.description}','${item.operationHours}','${item.individualPrice}','${item.purchaseLink}')|">
                            [[${item.name}]]
                        </label>
                        <div class="item-detail">
                            [[${item.category}]] &nbsp;|&nbsp; 공식 가격: <span class="price-tag">$[[${item.individualPrice}]]</span>
                        </div>
                    </div>
                </li>
            </ul>

            <div class="form-actions">
                <button type="button" onclick="document.getElementById('attractionForm').reset()" class="reset-btn">초기화</button>
                <button type="submit" class="submit-btn">선택 관광지 최저가 비교 →</button>
            </div>
        </form>
    </div>

    <!-- ===== 뮤지컬 섹션 ===== -->
    <div th:if="${currentCategory == 'musical'}">
        <div class="section-title">뮤지컬 선택 → 대행사별 최저가 실시간 비교</div>

        <ul class="musical-list">
            <li th:each="item : ${items}">
                <div class="musical-info">
                    <div class="musical-name">🎭 [[${item.name}]]</div>
                    <div class="musical-meta">
                        추천도: <strong th:text="${item.recommendationScore}"></strong>
                        &nbsp;|&nbsp; 최저가부터:
                        <span class="price-tag">$[[${item.lowestPrice}]]</span>
                        <span style="font-size:0.82em; color:#aaa;">(대행사 기준가)</span>
                    </div>
                </div>
                <a th:href="@{/compare/musical(id=${item.id})}" class="compare-btn">실시간 비교 →</a>
            </li>
        </ul>
    </div>
</div>

<!-- 관광지 상세 모달 -->
<div id="detailModal" class="modal">
    <div class="modal-content">
        <span class="close-btn" onclick="closeModal()">&times;</span>
        <h3 id="modalTitle" class="modal-title"></h3>
        <div class="modal-row"><span class="modal-label">카테고리: </span><span id="modalCategory"></span></div>
        <div class="modal-row"><span class="modal-label">공식 가격: </span><span id="modalPrice"></span></div>
        <div class="modal-row"><span class="modal-label">운영 시간: </span><span id="modalHours"></span></div>
        <div class="modal-row"><span class="modal-label">설명: </span><span id="modalDescription"></span></div>
        <a id="modalLink" href="#" target="_blank" class="modal-link">공식 홈페이지 바로가기</a>
    </div>
</div>

<script>
    var modal = document.getElementById("detailModal");

    function showDetailModal(name, category, description, hours, price, link) {
        document.getElementById("modalTitle").textContent = name;
        document.getElementById("modalCategory").textContent = category;
        document.getElementById("modalDescription").textContent = description;
        document.getElementById("modalHours").textContent = hours;
        document.getElementById("modalPrice").textContent = '$' + price;
        document.getElementById("modalLink").href = link;
        modal.style.display = "block";
    }

    function closeModal() { modal.style.display = "none"; }

    window.onclick = function(e) { if (e.target === modal) closeModal(); };
</script>
</body>
</html>
